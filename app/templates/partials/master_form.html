{% from "partials/bilabel.html" import bi %}
<form id="master-form" class="card bg-base-100 shadow" hx-post="{{ action }}" hx-target="#master-form" hx-swap="outerHTML">
  <div class="card-body gap-3">
    {% include "partials/form_fields.html" %}
    {% if not buttons_outside %}
    <div class="flex gap-2 mt-2">
      <button class="btn btn-primary">{{ bi('save') }}</button>
      <a class="btn btn-ghost" href="{{ back_url }}">{{ bi('back') }}</a>
    </div>
    {% endif %}
  </div>
</form>
