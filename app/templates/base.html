<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ L['app_name'][0] }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    @font-face { font-family: "Noto Sans Gujarati"; src: url("/static/NotoSansGujarati-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Noto Sans Gujarati"; src: url("/static/NotoSansGujarati-Bold.ttf"); font-weight: 700; }
    body { font-family: system-ui, "Noto Sans Gujarati", sans-serif; }
    .gu { font-family: "Noto Sans Gujarati", sans-serif; opacity: .75; }
  </style>
</head>
<body class="min-h-screen bg-base-200" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
