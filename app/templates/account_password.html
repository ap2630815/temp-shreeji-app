{% extends "base.html" %}
{% from "partials/bilabel.html" import bi %}
{% block title %}{{ L['change_password'][0] }}{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center p-4">
  <form class="card bg-base-100 shadow-xl w-full max-w-sm" hx-post="/account/password" hx-target="#pw-result" hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    <div class="card-body gap-3">
      <h1 class="card-title">{{ bi('change_password') }}</h1>
      <p class="text-sm opacity-70">{{ user.username }} · {{ user.role }}</p>
      <label class="form-control">
        <span class="label-text">{{ bi('current_password') }}</span>
        <input name="current_password" type="password" class="input input-bordered" autocomplete="current-password" required>
      </label>
      <label class="form-control">
        <span class="label-text">{{ bi('new_password') }}</span>
        <input name="new_password" type="password" minlength="8" class="input input-bordered" autocomplete="new-password" required>
      </label>
      <label class="form-control">
        <span class="label-text">{{ bi('confirm_password') }}</span>
        <input name="confirm_password" type="password" minlength="8" class="input input-bordered" autocomplete="new-password" required>
      </label>
      <label class="label cursor-pointer justify-start gap-2">
        <input type="checkbox" class="checkbox checkbox-sm"
               onchange="for (const n of ['current_password','new_password','confirm_password']) this.form[n].type = this.checked ? 'text' : 'password'">
        <span class="label-text">{{ bi('show_password') }}</span>
      </label>
      <div id="pw-result"></div>
      <button class="btn btn-primary">{{ bi('save') }}</button>
      <a class="btn btn-ghost btn-sm" href="/">{{ bi('back') }}</a>
    </div>
  </form>
</main>
{% endblock %}
